services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geofire}
      POSTGRES_USER: ${POSTGRES_USER:-geofire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geofire_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geofire} -d ${POSTGRES_DB:-geofire}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - gee_credentials:/root/.config/earthengine

  web:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
    command: streamlit run app/main.py --server.port 8501 --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - gee_credentials:/root/.config/earthengine

  # Opcional: repite el ciclo cada 3 h en tu PC. Se activa con: docker compose --profile auto up -d scheduler
  scheduler:
    build: .
    profiles: ["auto"]
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      CICLO_MINUTOS: "180"
    command: python scripts/programador.py
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - gee_credentials:/root/.config/earthengine

volumes:
  pgdata:
  gee_credentials:
