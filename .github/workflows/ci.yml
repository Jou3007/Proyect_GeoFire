# Integracion continua: estilo (flake8) y pruebas en cada pull request y en cada push a develop/main.
name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: geofire
          POSTGRES_USER: geofire
          POSTGRES_PASSWORD: geofire_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geofire -d geofire"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: src
      POSTGRES_HOST: localhost
      POSTGRES_DB: geofire
      POSTGRES_USER: geofire
      POSTGRES_PASSWORD: geofire_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Crear esquema de la base
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=geofire_dev psql -h localhost -U geofire -d geofire -f db/init.sql
      - name: Estilo (flake8)
        run: flake8 src app scripts tests
      - name: Pruebas
        run: pytest -q tests
